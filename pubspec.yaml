name: costr
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.11.0-beta+29

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # --- Nostr client foundation (shared across all 5 platforms) ---
  # Relay transport (WebSocket) — cross-platform.
  web_socket_channel: ^3.0.3
  # SHA-256 / hashing (event id computation per NIP-01).
  crypto: ^3.0.7
  # Hex encode/decode for event ids, pubkeys, signatures.
  hex: ^0.2.0
  # State management.
  flutter_riverpod: ^3.3.2
  # Declarative routing.
  go_router: ^17.3.0
  # secp256k1 Schnorr (BIP-340): private->public key derivation, sign, verify.
  # Used for NIP-01 identity. SDK >=2.13.0 <4.0.0 (Dart 3.12 compatible).
  bip340: ^0.3.1
  # OS keystore for the nsec (Android Keystore / iOS Keychain / libsecret on Linux).
  flutter_secure_storage: ^10.3.1
  # Avatar image loading with disk cache + placeholder/error fallback (NIP-01 kind 0 picture).
  cached_network_image: ^3.4.1
  # Disk cache backend (timed/UA-customized FileService for post media) — direct
  # dep because we inject a custom CacheManager into cached_network_image.
  flutter_cache_manager: ^3.4.2
  # Markdown rendering of post content (GitHub-flavored).
  flutter_markdown: ^0.7.7+1
  # markdown core (ExtensionSet) — direct import per lint; transitive via flutter_markdown.
  markdown: ^7.3.1
  # Inline video playback (network) for video media in posts.
  video_player: ^2.13.0
  # Editable text with inline widget spans — used by the composer to render
  # @-mention chips over bare `nostr:nprofile1…` entities (Amethyst UX).
  # 17.0.0 is built against Flutter 3.44.0 (matches our stable line).
  extended_text_field: ^17.0.0
  # NIP-44 crypto primitives (secp256k1 ECDH, ChaCha20, HKDF) for private bookmarks.
  pointycastle: ^4.0.0
  # HTTP client for Blossom media upload.
  http: ^1.4.0
  # Native file/image picker for attaching media.
  file_picker: ^10.0.0
  # Launch URLs in the default browser (for hyperlinks in posts).
  url_launcher: ^6.3.0
  # Image cropping (square avatar + ratio banner) before Blossom upload.
  image_cropper: ^12.2.1
  # Local cache: reactive SQLite ORM for 30-day Nostr event persistence.
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  # Biometric / device-lock auth gate for revealing the private key in account backup.
  # Mobile: fingerprint/FaceID/device PIN. Desktop (Linux): unsupported → gated off.
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  # OS-native share sheet (post sharing via njump.me URLs).
  share_plus: ^11.0.0
  # Save images/videos to the system gallery on mobile (Android MediaStore /
  # iOS Photos) — used by the media viewer & fullscreen video save buttons.
  # Desktop + generic files fall back to file_picker's save-as dialog.
  gal: ^2.3.3
  # Read the running app's version/build number for the settings-page footer.
  package_info_plus: ^8.0.0
  # Material/Cupertino localization delegates (Chinese text-selection toolbar etc.).
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation for drift (local cache).
  build_runner: ^2.4.0
  drift_dev: ^2.34.0
  # Generate app launcher icons.
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/costr_icon.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
