<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 460" width="240" height="460" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <!-- Costr logo mark: three right-pointing broadcast arcs + a source dot.
         Faithful to lib/widgets/costr_logo.dart (_LogoPainter): center dot on
         the left (you = the source), arcs fanning right (broadcasting). -->
    <symbol id="mark" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
        <path d="M36.6 27.4 A8 8 0 0 1 36.6 36.6"/>
        <path d="M41.5 24 A14 14 0 0 1 41.5 40"/>
        <path d="M46.4 20.5 A20 20 0 0 1 46.4 43.5"/>
      </g>
      <circle cx="30" cy="32" r="2.6" fill="currentColor"/>
    </symbol>
    <!-- Bottom-nav line icons (match ui_demo / Material outlined). -->
    <symbol id="ic-home" viewBox="0 0 24 24">
      <path d="M3 11l9-8 9 8M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </g>
    </symbol>
    <symbol id="ic-bell" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/><path d="M10 21a2 2 0 0 0 4 0"/>
      </g>
    </symbol>
    <symbol id="ic-person" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
      </g>
    </symbol>
    <!-- Globe (语言过滤 topbar). -->
    <symbol id="ic-globe" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
      </g>
    </symbol>
    <!-- Action-row line icons. -->
    <symbol id="ac-reply" viewBox="0 0 24 24">
      <path d="M9 17l-5-5 5-5M4 12h11a5 5 0 0 1 5 5v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ac-repost" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h13l-3-3M4 7l3 3"/><path d="M20 17H7l3 3M20 17l-3-3"/>
      </g>
    </symbol>
    <symbol id="ac-heart" viewBox="0 0 24 24">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ac-bookmark" viewBox="0 0 24 24">
      <path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ac-share" viewBox="0 0 24 24">
      <path d="M4 12v7h16v-7M16 6l-4-4-4 4M12 2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="240" height="460" fill="#FFFFFF"/>

  <!-- topbar -->
  <rect x="0" y="0" width="240" height="52" fill="#FFFFFF"/>
  <use href="#mark" x="12" y="14" width="26" height="26" color="#0F1419"/>
  <text x="42" y="33" font-size="17" font-weight="700" fill="#0F1419">Costr</text>
  <!-- relay chip 3/3 + green dot -->
  <circle cx="150" cy="28" r="4" fill="#00BA7C"/>
  <text x="159" y="32" font-size="11" fill="#536471">3/3</text>
  <use href="#ic-globe" x="186" y="15" width="22" height="22" color="#536471"/>
  <use href="#ic-search" x="212" y="15" width="22" height="22" color="#0F1419"/>
  <line x1="0" y1="52" x2="240" y2="52" stroke="#EFF3F4"/>

  <!-- seg control -->
  <rect x="80" y="62" width="80" height="28" rx="14" fill="#F7F9F9"/>
  <rect x="80" y="62" width="40" height="28" rx="14" fill="#0F1419"/>
  <text x="100" y="80" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">全球</text>
  <text x="140" y="80" font-size="12" fill="#536471" text-anchor="middle">关注</text>

  <!-- card 1 -->
  <g>
    <circle cx="30" cy="116" r="15" fill="#EFF3F4"/>
    <text x="50" y="112" font-size="14" font-weight="600" fill="#0F1419">阿橘</text>
    <text x="92" y="112" font-size="11" fill="#536471">@juju · 2h</text>
    <text x="50" y="130" font-size="13" fill="#0F1419">单代码库五端，关注流走 outbox 定向拉取。</text>
    <g color="#536471">
      <use href="#ac-reply" x="50" y="142" width="18" height="18"/>
      <use href="#ac-repost" x="92" y="142" width="18" height="18"/>
      <use href="#ac-heart" x="134" y="142" width="18" height="18"/>
      <use href="#ac-bookmark" x="176" y="142" width="18" height="18"/>
      <use href="#ac-share" x="210" y="142" width="18" height="18"/>
    </g>
    <text x="68" y="155" font-size="10" fill="#536471">3</text>
    <text x="110" y="155" font-size="10" fill="#536471">1</text>
    <text x="152" y="155" font-size="10" fill="#536471">18</text>
    <line x1="14" y1="172" x2="226" y2="172" stroke="#EFF3F4"/>
  </g>

  <!-- card 2 -->
  <g>
    <circle cx="30" cy="200" r="15" fill="#EFF3F4"/>
    <text x="50" y="196" font-size="14" font-weight="600" fill="#0F1419">小满</text>
    <text x="82" y="196" font-size="11" fill="#536471">@xm · 5h</text>
    <text x="50" y="214" font-size="13" fill="#0F1419">今天给打闪加了自定义留言。</text>
    <g color="#536471">
      <use href="#ac-reply" x="50" y="226" width="18" height="18"/>
      <use href="#ac-repost" x="92" y="226" width="18" height="18"/>
      <use href="#ac-heart" x="134" y="226" width="18" height="18"/>
      <use href="#ac-bookmark" x="176" y="226" width="18" height="18"/>
      <use href="#ac-share" x="210" y="226" width="18" height="18"/>
    </g>
    <line x1="14" y1="256" x2="226" y2="256" stroke="#EFF3F4"/>
  </g>

  <!-- FAB: black circle + white Costr mark -->
  <circle cx="206" cy="384" r="26" fill="#0F1419"/>
  <use href="#mark" x="190" y="368" width="32" height="32" color="#FFFFFF"/>

  <!-- bottom nav -->
  <line x1="0" y1="408" x2="240" y2="408" stroke="#EFF3F4"/>
  <use href="#ic-home" x="20" y="420" width="22" height="22" color="#0F1419"/>
  <text x="31" y="455" font-size="9" fill="#0F1419" text-anchor="middle">首页</text>
  <use href="#ic-search" x="80" y="420" width="22" height="22" color="#536471"/>
  <text x="91" y="455" font-size="9" fill="#536471" text-anchor="middle">搜索</text>
  <use href="#ic-bell" x="140" y="420" width="22" height="22" color="#536471"/>
  <circle cx="160" cy="424" r="7" fill="#F4212E"/>
  <text x="160" y="427" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="151" y="455" font-size="9" fill="#536471" text-anchor="middle">通知</text>
  <use href="#ic-person" x="200" y="420" width="22" height="22" color="#536471"/>
  <text x="211" y="455" font-size="9" fill="#536471" text-anchor="middle">我的</text>
</svg>
